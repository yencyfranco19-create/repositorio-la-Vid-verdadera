<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ministerio de Alabanza La Vid Verdadera</title>
<style>
:root{--bg:#0c0c0e;--c:#16161a;--c2:#1e1e24;--b:#2a2a32;--t:#e9e9ee;--m:#85858f;--a:#8b5cf6;--r:#d86a6a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,Segoe UI,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
.card h1{font-size:20px;letter-spacing:3px;text-transform:uppercase;font-weight:600}
.card p.s{color:var(--m);font-size:13px;margin:6px 0 24px}
input,select{width:100%;background:var(--c2);border:1px solid var(--b);border-radius:8px;padding:11px 12px;margin-bottom:12px;outline:none}
input:focus,select:focus{border-color:var(--a)}
.btn{background:var(--a);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700;letter-spacing:2px;cursor:pointer;width:100%}
.btn:hover{background:#7c3aed}
.btn.g:hover{background:var(--c2)}
.btn.sm{width:auto;padding:8px 14px;font-size:12px}
.btn.g{background:transparent;color:var(--m);border:1px solid var(--b)}
.note{color:var(--m);font-size:11px;margin-top:16px}
.err{color:var(--r);font-size:12px;min-height:16px;margin-bottom:8px}
/* header / menu */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;padding:12px 16px}
.ham{background:none;border:0;font-size:24px;cursor:pointer;color:var(--t)}
header h2{font-size:14px;letter-spacing:3px;flex:1;font-weight:600}
.ses{font-size:11px;color:var(--m);display:flex;align-items:center;gap:6px}
.ses i{width:8px;height:8px;border-radius:50%;background:#4caf7d;display:inline-block}
#ov{position:fixed;inset:0;background:#0009;z-index:9}
nav{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--c);border-right:1px solid var(--b);z-index:10;padding:20px 0;transform:translateX(-100%);transition:.25s}
nav.o{transform:none}
nav .lg{padding:0 22px 18px;color:var(--a);letter-spacing:3px;font-size:12px;border-bottom:1px solid var(--b);margin-bottom:8px}
nav a{display:block;padding:14px 22px;letter-spacing:2px;font-size:13px;cursor:pointer;color:var(--m)}
nav a:hover,nav a.on{color:var(--t);background:var(--c2)}
nav a.out{color:var(--r);margin-top:12px;border-top:1px solid var(--b)}
/* main */
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.top input{margin:0}
.top .btn{white-space:nowrap}
.item{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--c2);border:1px solid var(--b);object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--a);flex:none}
.inf{flex:1;min-width:0}
.inf b{display:block;letter-spacing:1px;text-transform:uppercase;font-size:14px}
.inf small{color:var(--m);font-size:12px}
.tag{font-size:10px;letter-spacing:1.5px;border:1px solid var(--a);color:var(--a);padding:3px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.x{background:none;border:0;color:var(--m);font-size:18px;cursor:pointer;padding:4px}
.x:hover{color:var(--r)}
.empty{color:var(--m);text-align:center;padding:30px 0;font-size:13px}
.chips span{display:inline-block;background:var(--c2);border-radius:20px;padding:3px 10px;margin:3px 4px 0 0;font-size:12px}
.chips span.m{color:var(--a)}
.dt{color:var(--a);font-weight:700;letter-spacing:1px;font-size:13px;text-transform:uppercase}
.col{flex-direction:column;align-items:stretch;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--b)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid .x{position:absolute;top:2px;right:2px;background:#000a;border-radius:50%;width:26px;height:26px;color:#fff}
.sum{display:flex;gap:10px;margin-bottom:14px}
.sum div{flex:1;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center}
.sum small{color:var(--m);font-size:11px;letter-spacing:1px}
.sum b{display:block;font-size:18px;margin-top:2px}
.pos{color:#4caf7d}.neg{color:var(--r)}
/* modal */
#md{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#md .card{text-align:left;max-height:90vh;overflow:auto}
#md h3{letter-spacing:2px;font-size:14px;margin-bottom:16px;text-transform:uppercase}
#md label{font-size:11px;color:var(--m);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.ck{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ck label{display:flex;align-items:center;gap:6px;background:var(--c2);border:1px solid var(--b);padding:6px 10px;border-radius:20px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--t);margin:0;cursor:pointer}
.ck input{width:auto;margin:0}
.bt{display:flex;gap:10px;margin-top:6px}
</style></head><body>

<section id="login">
 <form class="card" id="lf">
  <h1 id="lt"></h1><p class="s" id="ls"></p>
  <input id="u" placeholder="Usuario" autocomplete="username">
  <input id="p" type="password" placeholder="Contraseña" autocomplete="current-password">
  <div class="err" id="le"></div>
  <button class="btn">INGRESAR</button>
  <p class="note">Modo prueba · usuario: equipo / clave: 1234</p>
 </form>
</section>

<div id="app" class="hide">
 <header><button class="ham" onclick="menu(1)" aria-label="Menú">☰</button><h2 id="vt"></h2><span class="ses"><i></i><span id="su"></span></span></header>
 <div id="ov" class="hide" onclick="menu(0)"></div>
 <nav id="nv"><div class="lg" id="nl"></div>
  <a data-v="miembros">MIEMBROS</a><a data-v="cancionero">CANCIONERO</a><a data-v="planificacion">PLANIFICACION</a><a data-v="galeria">GALERIA</a><a data-v="finanzas">FINANZAS</a>
  <a class="out" onclick="logout()">CERRAR SESION</a></nav>
 <main id="mn"></main>
</div>
<div id="md" class="hide"><form class="card" id="mf"></form></div>

<script>
const CFG={titulo:'Ministerio de Alabanza La Vid Verdadera',sub:'Acceso privado del equipo',user:'equipo',pass:'1234'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEM={};
const store=(w,k,v)=>{try{const s=window[w];if(v===undefined)return s.getItem(k);if(v===null)s.removeItem(k);else s.setItem(k,v);return true}catch(e){if(v===undefined)return MEM[w+k]??null;if(v===null)delete MEM[w+k];else MEM[w+k]=v;return false}};
const ses=(k,v)=>store('sessionStorage',k,v);
const ld=(k,d)=>{try{return JSON.parse(store('localStorage','al_'+k))||d}catch(e){return d}};
const sv=(k,v)=>{store('localStorage','al_'+k,JSON.stringify(v))};
const D={
 miembros:ld('miembros',[
  {id:1,n:'María Fernández',d:'Cumple: 12 de marzo',r:'Cantante',f:''},
  {id:2,n:'Carlos Rivas',d:'Guitarra eléctrica',r:'Músico',f:''},
  {id:3,n:'Daniel Pérez',d:'Ingresó en 2022',r:'Sonidista',f:''},
  {id:4,n:'Lucía Gómez',d:'Equipo de medios',r:'Proyeccion',f:''}]),
 canciones:ld('canciones',[
  {id:1,t:'Cuán Grande Es Él',k:'G',s:'Himno · lenta'},
  {id:2,t:'Santo Espíritu',k:'D',s:'Adoración · 68 bpm'},
  {id:3,t:'Digno y Santo',k:'A',s:'Alabanza · rápida'},
  {id:4,t:'Tu Fidelidad',k:'E',s:'Congregacional · media'}]),
 plan:ld('plan',[]),galeria:ld('galeria',[]),finanzas:ld('finanzas',[])
};
const save=k=>sv(k,D[k]),nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const fd=d=>{if(!d)return'';const[y,m,x]=d.split('-');return new Date(y,m-1,x).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};

/* login */
$('#lt').textContent=CFG.titulo;$('#ls').textContent=CFG.sub;$('#nl').textContent=CFG.titulo.toUpperCase();
$('#lf').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();
 try{
  if($('#u').value.trim().toLowerCase()===CFG.user&&$('#p').value===CFG.pass){ses('al_ses',CFG.user);start()}
  else $('#le').textContent='Usuario o contraseña incorrectos'
 }catch(err){$('#le').textContent='Error al ingresar: '+err.message}});
function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#su').textContent=ses('al_ses')||CFG.user;go('miembros')}
function logout(){ses('al_ses',null);menu(0);$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#u').value=$('#p').value='';$('#le').textContent=''}
function menu(o){$('#nv').classList.toggle('o',!!o);$('#ov').classList.toggle('hide',!o)}
document.querySelectorAll('nav a[data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));

/* modal */
function modal(title,fields,cb){
 $('#mf').innerHTML=`<h3>${title}</h3>`+fields.map(f=>{
  let i;
  if(f.t==='select')i=`<select id="f_${f.id}">${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='multi')i=`<div class="ck">${f.o.map(o=>`<label><input type="checkbox" name="${f.id}" value="${esc(o)}">${esc(o)}</label>`).join('')||'<small style="color:var(--m)">Sin opciones</small>'}</div>`;
  else i=`<input id="f_${f.id}" type="${f.t||'text'}" ${f.t==='file'?'accept="image/*"':''} placeholder="${esc(f.p||'')}" ${f.req?'required':''}>`;
  return`<label>${f.l}</label>`+i}).join('')+`<div class="bt"><button type="button" class="btn g sm" onclick="closeM()">CANCELAR</button><button class="btn sm" style="flex:1">GUARDAR</button></div>`;
 $('#md').classList.remove('hide');
 $('#mf').onsubmit=async e=>{e.preventDefault();const v={};
  for(const f of fields){
   if(f.t==='multi')v[f.id]=[...document.querySelectorAll(`[name=${f.id}]:checked`)].map(x=>x.value);
   else if(f.t==='file'){const fl=$('#f_'+f.id).files[0];v[f.id]=fl?await img(fl):''}
   else v[f.id]=$('#f_'+f.id).value.trim()}
  cb(v);closeM()};
 const first=$('#mf input,#mf select');first&&first.focus()}
function closeM(){$('#md').classList.add('hide')}
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
function img(file,max=480){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
function del(k,id,msg){if(confirm(msg||'¿Eliminar?')){D[k]=D[k].filter(x=>x.id!==id);save(k);go(cur)}}

/* vistas */
let cur='miembros',q='';
const V={
 miembros(){
  const h=D.miembros.map(m=>`<div class="item">${m.f?`<img class="av" src="${m.f}">`:`<div class="av">${esc(ini(m.n))}</div>`}
   <div class="inf"><b>${esc(m.n)}</b><small>${esc(m.d)}</small></div><span class="tag">${esc(m.r)}</span><button class="x" onclick="del('miembros',${m.id})">✕</button></div>`).join('');
  return`<div class="top"><div style="flex:1"></div><button class="btn sm" onclick="addM()">+ AÑADIR MIEMBRO</button></div>`+(h||'<div class="empty">Aún no hay miembros</div>')},
 cancionero(){
  const l=D.canciones.filter(c=>(c.t+c.k+c.s).toLowerCase().includes(q.toLowerCase()));
  return`<div class="top"><input id="q" placeholder="Buscar canción, tono o estilo…" value="${esc(q)}" oninput="q=this.value;ren()"><button class="btn sm" onclick="addC()">+ CANCIÓN</button></div>`+
  (l.map(c=>`<div class="item"><div class="av" style="border-radius:10px">${esc(c.k)}</div><div class="inf"><b>${esc(c.t)}</b><small>${esc(c.s)}</small></div><span class="tag">Tono ${esc(c.k)}</span><button class="x" onclick="del('canciones',${c.id})">✕</button></div>`).join('')||'<div class="empty">Sin resultados</div>')},
 planificacion(){
  const l=[...D.plan].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return`<div class="top"><div style="flex:1"></div><button class="btn sm" onclick="addP()">+ NUEVO SERVICIO</button></div>`+
  (l.map(p=>`<div class="item col"><div class="row"><span class="dt">${fd(p.fecha)}</span><button class="x" onclick="del('plan',${p.id})">✕</button></div>
   ${p.nombre?`<b>${esc(p.nombre)}</b>`:''}<div class="chips">${p.canciones.map(c=>`<span>♪ ${esc(c)}</span>`).join('')||'<small style="color:var(--m)">Sin canciones</small>'}</div>
   <div class="chips">${p.miembros.map(c=>`<span class="m">${esc(c)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">No hay servicios planificados</div>')},
 galeria(){
  return`<div class="top"><div style="flex:1"></div><button class="btn sm" onclick="addG()">+ SUBIR FOTO</button></div>`+
  (D.galeria.length?`<div class="grid">${D.galeria.map(g=>`<div><img src="${g.f}"><button class="x" onclick="del('galeria',${g.id})">✕</button></div>`).join('')}</div>`:'<div class="empty">La galería está vacía</div>')},
 finanzas(){
  const i=D.finanzas.filter(x=>x.tipo==='Ingreso').reduce((s,x)=>s+x.m,0),e=D.finanzas.filter(x=>x.tipo==='Egreso').reduce((s,x)=>s+x.m,0),f=n=>'$'+n.toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
  return`<div class="sum"><div><small>INGRESOS</small><b class="pos">${f(i)}</b></div><div><small>EGRESOS</small><b class="neg">${f(e)}</b></div><div><small>BALANCE</small><b>${f(i-e)}</b></div></div>
  <div class="top"><div style="flex:1"></div><button class="btn sm" onclick="addF()">+ MOVIMIENTO</button></div>`+
  ([...D.finanzas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>`<div class="item"><div class="inf"><b>${esc(x.c)}</b><small>${x.fecha}</small></div><b class="${x.tipo==='Ingreso'?'pos':'neg'}">${x.tipo==='Ingreso'?'+':'−'}${f(x.m)}</b><button class="x" onclick="del('finanzas',${x.id})">✕</button></div>`).join('')||'<div class="empty">Sin movimientos</div>')}
};
function ren(){const s=$('#q'),pos=s&&s.selectionStart;$('#mn').innerHTML=V[cur]();const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}}
function go(v){cur=v;q='';menu(0);$('#vt').textContent=v.toUpperCase();document.querySelectorAll('nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));ren()}

/* formularios */
const hoy=()=>new Date().toISOString().slice(0,10);
function addM(){modal('Añadir miembro',[{id:'n',l:'Nombre',req:1},{id:'r',l:'Rol',t:'select',o:['Cantante','Músico','Sonidista','Proyeccion','Director','Otro']},{id:'d',l:'Dato secundario',p:'Fecha, nota…'},{id:'f',l:'Foto (opcional)',t:'file'}],
 v=>{D.miembros.push({id:nid(D.miembros),n:v.n,r:v.r,d:v.d,f:v.f});save('miembros');go('miembros')})}
function addC(){modal('Nueva canción',[{id:'t',l:'Título',req:1},{id:'k',l:'Tonalidad',p:'Ej. G, Am, F#',req:1},{id:'s',l:'Estilo / nota',p:'Adoración · lenta'}],
 v=>{D.canciones.push({id:nid(D.canciones),t:v.t,k:v.k,s:v.s});save('canciones');go('cancionero')})}
function addP(){modal('Nuevo servicio',[{id:'fecha',l:'Fecha',t:'date',req:1},{id:'nombre',l:'Nombre del servicio',p:'Culto dominical'},{id:'canciones',l:'Canciones',t:'multi',o:D.canciones.map(c=>c.t)},{id:'miembros',l:'Equipo',t:'multi',o:D.miembros.map(m=>m.n)}],
 v=>{D.plan.push({id:nid(D.plan),...v});save('plan');go('planificacion')});$('#f_fecha').value=hoy()}
function addG(){modal('Subir foto',[{id:'f',l:'Imagen',t:'file',req:1}],v=>{if(!v.f)return;D.galeria.push({id:nid(D.galeria),f:v.f});save('galeria');go('galeria')})}
function addF(){modal('Nuevo movimiento',[{id:'tipo',l:'Tipo',t:'select',o:['Ingreso','Egreso']},{id:'c',l:'Concepto',req:1},{id:'m',l:'Monto',t:'number',req:1},{id:'fecha',l:'Fecha',t:'date',req:1}],
 v=>{D.finanzas.push({id:nid(D.finanzas),tipo:v.tipo,c:v.c,m:Math.abs(parseFloat(v.m))||0,fecha:v.fecha});save('finanzas');go('finanzas')});$('#f_fecha').value=hoy();$('#f_m').step='0.01'}

if(ses('al_ses'))start();
</script></body></html>
